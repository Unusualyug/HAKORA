# Render Blueprint for CampusSaathi
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: campussaathi
    runtime: node
    region: singapore           # closest to India; keep DB in the same region
    plan: starter
    buildCommand: npm ci && npx prisma generate && npm run build
    # Run migrations in a controlled pre-deploy step, NOT from every instance.
    preDeployCommand: npx prisma migrate deploy && npx prisma db seed
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: campussaathi-db
          property: connectionString   # internal connection string (same region)
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false                    # set in dashboard
      - key: ADMIN_INITIAL_PASSWORD
        sync: false                    # set in dashboard; change after first login
      - key: NEXT_PUBLIC_SITE_URL
        sync: false                    # e.g. https://campussaathi.onrender.com
      - key: BUSINESS_NAME
        value: HAKORA
      - key: BUSINESS_WHATSAPP
        value: "919825751614"
      # Object storage (Cloudflare R2 / S3) — required in production because
      # Render's filesystem is ephemeral. Uploads fall back to local disk only in dev.
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_REGION
        value: auto
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_ACCESS_KEY
        sync: false
      - key: STORAGE_SECRET_KEY
        sync: false
      - key: GOOGLE_ANALYTICS_ID
        sync: false
      # Razorpay (server-side secrets only)
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Optional SMTP notifications
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: campussaathi-db
    region: singapore
    plan: starter
    postgresMajorVersion: "16"
